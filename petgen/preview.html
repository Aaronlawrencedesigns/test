<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>__NAME__ preview</title>
  <style>
    /* A pretend Mac desktop: the pet sits bottom-right exactly like in the Desktop Sidekicks app,
       with the same hover "Menu" pill, right-click menu, sizes, dragging and feed tray. */
    html, body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(160deg, #dfe3ee, #cfc6dc); font: 14px/1.4 -apple-system, system-ui, sans-serif; color: #221d27; }
    #stage { position: fixed; border: 0; background: transparent; }
    .panel { position: fixed; left: 16px; top: 16px; max-width: 460px; background: rgba(255,255,255,.82); backdrop-filter: blur(8px);
      border: 1px solid #d3cad9; border-radius: 12px; padding: 14px 16px; box-shadow: 0 10px 30px -12px rgba(34,29,39,.3); }
    .panel h1 { margin: 0 0 4px; font-size: 20px; }
    .panel p { margin: 0 0 10px; color: #6a6170; }
    .panel .row { display: flex; flex-wrap: wrap; gap: 6px; }
    .panel button { padding: 7px 11px; border-radius: 999px; border: 1px solid #cfc8d6; background: #fff; cursor: pointer; font: inherit; }
    .panel button.done { background: #e6f4ea; border-color: #9ccfaa; }
    .panel button.done::after { content: " ✓"; color: #2e7d32; }
    .panel a { color: #2f45c4; }
    #photos { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
    #photos a { display: block; text-align: center; color: #6a6170; font-size: 11px; text-decoration: none; }
    #photos img { height: 84px; width: 84px; object-fit: cover; border-radius: 8px; display: block; border: 1px solid #d3cad9; }
    #menu { position: fixed; display: none; min-width: 230px; padding: 5px; background: rgba(246,244,248,.97); backdrop-filter: blur(12px);
      border: 1px solid rgba(0,0,0,.14); border-radius: 9px; box-shadow: 0 12px 34px rgba(0,0,0,.25); font-size: 13.5px; z-index: 10; }
    #menu div.i { padding: 3px 12px; border-radius: 5px; cursor: default; white-space: nowrap; display: flex; justify-content: space-between; gap: 18px; }
    #menu div.i:hover { background: #2f6fe4; color: #fff; }
    #menu hr { border: 0; border-top: 1px solid rgba(0,0,0,.12); margin: 4px 6px; }
    #menu .sub { padding: 2px 12px; color: #6a6170; font-size: 12px; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>__NAME__</h1>
    <p>Works like the Mac app: hover the pet for <b>Menu</b>, right-click it, drag it, move your mouse around for head tracking.
      Leave the mouse still for 30 s and it naps. Each button turns green once you've played it.</p>
    <div class="row" id="quick"></div>
    <div id="photos" aria-label="Uploaded photos"></div>
  </div>
  <iframe id="stage" srcdoc="" title="__NAME__"></iframe>
  <div id="menu" role="menu"></div>
  <script>
    const PET = __PET__;
    const NAME = PET.name || 'your pet';
    const LABELS = PET.labels || {};
    // same items, in the same order, as the app's menu (app/main.js ACTIONS)
    const ACTIONS = [['Sit (Default - Mouse Tracking)', 'sit'], ['Lie down', 'lie'], ['Sleep (Pause)', 'sleep'], ['Stand up', 'stand'],
      ['Happy wiggle', 'wag'], ['Puppy eyes', 'puppy'], ['Bark', 'bark'], ['Poop', 'poop']]
      .map(([l, a]) => [LABELS[a] || l, a]);
    const SIZES = [['Tiny', 0.4], ['Small', 0.6], ['Medium', 0.8], ['Normal', 1], ['Large', 1.3]];
    const frame = document.getElementById('stage'), menu = document.getElementById('menu');
    let scale = 1, extra = 0, right = 16, bottom = 0, playful = true;
    const base = location.href.replace(/[^/?#]*([?#].*)?$/, '');

    function layout() {
      const s = Math.round(400 * scale);
      Object.assign(frame.style, { width: `${s}px`, height: `${s + extra}px`, right: `${right}px`, bottom: `${bottom}px` });
    }
    const rect = () => { const r = frame.getBoundingClientRect(); return { x: r.left, y: r.top, width: r.width, height: r.height }; };
    const send = (m) => frame.contentWindow && frame.contentWindow.postMessage(Object.assign({ bounds: rect() }, m), '*');
    const played = new Set();
    function act(a) {
      send({ t: 'a', a });
      played.add(a);
      const b = document.querySelector(`#quick [data-a="${a}"]`);
      if (b) b.classList.add('done');
    }

    frame.srcdoc = `<!doctype html><html><head><meta charset="utf-8"><base href="${base}">
      <link rel="stylesheet" href="style.css"><style>html,body{background:transparent}</style>
      <script>window.CHUNKY_ASSETS='pet/';window.PET=${JSON.stringify(PET)};
      (function(){let oc=()=>{},oa=()=>{};let b={x:0,y:0,width:innerWidth,height:innerHeight};
       const up=m=>parent.postMessage(Object.assign({pv:true},m),'*');
       addEventListener('message',e=>{const m=e.data||{};if(m.bounds)b=m.bounds;if(m.t==='c')oc({cursor:m.c,bounds:b});if(m.t==='a')oa(m.a);});
       addEventListener('mousemove',e=>oc({cursor:{x:e.clientX+b.x,y:e.clientY+b.y},bounds:b}));
       window.dogApi={menuButton:true,onCursor:f=>oc=f,onAction:f=>oa=f,setHover(){},
         drag:(dx,dy)=>up({t:'drag',dx,dy}),contextMenu:at=>up({t:'menu',at}),setExtraTop:px=>up({t:'extend',px})};})();<\/script>
      </head><body><canvas id="dog"></canvas><div id="bubble"></div><div id="zzz"><span>z</span><span>z</span><span>Z</span></div>
      <div id="tray"></div><div id="held"></div><script src="app.js"><\/script></body></html>`;

    function item(label, fn, right = '') {
      const d = document.createElement('div');
      d.className = 'i'; d.setAttribute('role', 'menuitem');
      d.innerHTML = `<span></span><span></span>`;
      d.firstChild.textContent = label; d.lastChild.textContent = right;
      d.onmousedown = (e) => { e.preventDefault(); hideMenu(); fn(); };
      menu.appendChild(d);
    }
    const sep = () => menu.appendChild(document.createElement('hr'));
    function showMenu(at) {
      menu.textContent = '';
      item('✕  Close menu', () => {});
      sep();
      item(`Feed ${NAME}`, () => act('feed'));
      sep();
      ACTIONS.forEach(([l, a]) => item(l, () => act(a)));
      sep();
      const pm = document.createElement('div'); pm.className = 'sub'; pm.textContent = 'Playful Mode (Do Random Tricks)'; menu.appendChild(pm);
      [['On', true], ['Off', false]].forEach(([l, on]) => item(`   ${l}`, () => { playful = on; send({ t: 'a', a: on ? 'playful:on' : 'playful:off' }); }, playful === on ? '✓' : ''));
      sep();
      const h = document.createElement('div'); h.className = 'sub'; h.textContent = 'Size'; menu.appendChild(h);
      SIZES.forEach(([l, s]) => item(`   ${l}`, () => { scale = s; layout(); }, s === scale ? '✓' : ''));
      menu.style.display = 'block';
      // like the app: open just above the pet, centred on it
      const r = rect(), w = menu.offsetWidth, hgt = menu.offsetHeight;
      let x = r.x + (at ? at.x : r.width / 2) - w / 2, y = r.y + (at ? at.y : 0) - hgt - 6;
      x = Math.max(8, Math.min(innerWidth - w - 8, x)); y = Math.max(8, y);
      Object.assign(menu.style, { left: `${x}px`, top: `${y}px` });
    }
    function hideMenu() { menu.style.display = 'none'; }
    addEventListener('mousedown', (e) => { if (!menu.contains(e.target)) hideMenu(); });
    addEventListener('keydown', (e) => { if (e.key === 'Escape') hideMenu(); });

    addEventListener('message', (e) => {
      const m = e.data || {};
      if (!m.pv) return;
      if (m.t === 'menu') showMenu(m.at);
      if (m.t === 'drag') {
        right = Math.max(0, Math.min(innerWidth - rect().width, right - m.dx));
        bottom = Math.max(0, Math.min(innerHeight - rect().height, bottom - m.dy));
        layout(); send({ t: 'b' });
      }
      if (m.t === 'extend') { extra = Math.max(0, Math.min(800, +m.px || 0)); layout(); send({ t: 'b' }); }
    });
    addEventListener('mousemove', (e) => send({ t: 'c', c: { x: e.clientX, y: e.clientY } }));
    addEventListener('resize', () => send({ t: 'b' }));

    const quick = document.getElementById('quick');
    [[`Feed`, 'feed'], ...ACTIONS.map(([l, a]) => [a === 'sit' ? 'Sit' : l, a])].forEach(([l, a]) => {
      const b = document.createElement('button');
      b.textContent = l; b.dataset.a = a; b.onclick = () => act(a);
      quick.appendChild(b);
    });
    // the customer's uploaded photos (served next to the preview on the site; absent locally)
    const ph = document.getElementById('photos');
    ['front', 'side', 'back', 'sit'].forEach((v) => {
      const a = document.createElement('a'), img = new Image();
      a.href = `photos/${v}`; a.target = '_blank';
      img.alt = v; img.onerror = () => a.remove(); img.src = `photos/${v}`;
      a.append(img, v);
      ph.appendChild(a);
    });
    layout();
  </script>
</body>
</html>
